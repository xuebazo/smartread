[server]
# Tolerate slow/unstable network (important for mainland China users)
maxUploadSize = 200
# Bind to localhost only, avoid exposing the app to the LAN
address = "127.0.0.1"

[browser]
gatherUsageStats = false

[theme]
# Clean theme for better mobile readability
base = "light"
primaryColor = "#1E40AF"
